ai_usage_summary: |
  Our team employed a collaborative multi-LLM workflow to navigate the strict CPU and runtime constraints of the hackathon. During the initial design phase, we fed the submission specification to both ChatGPT and Claude (Opus 4.6), prompting them to debate the optimal architecture. This LLM debate led to our core design choice: separating the pipeline into a GPU-heavy offline precomputation stage (for embeddings and FAISS index building) and an ultra-fast, CPU-only runtime stage using a lightweight Cross-Encoder. Once the architecture was locked in, we utilized the Antigravity IDE (powered by Claude/Gemini) as our primary pair-programmer. Antigravity assisted in translating our implementation plan into production-ready Python code, specifically writing the batch-optimized FAISS retrieval logic, the 7-feature weighted scoring algorithm, the dynamic reasoning text generator, and the complex edge-case logic required for our two-layer honeypot detection system. Crucially, all high-level engineering decisions, dataset schema mapping, and validation testing were driven by the human team to ensure the LLM outputs strictly adhered to the competition's computational boundaries.

methodology_summary: |
  Our system uses a deterministic, multi-stage retrieval and ranking pipeline designed to execute completely offline on a CPU within 50 seconds. Stage 1 addresses the cold-start problem via a fast FAISS vector search combined with boolean skill filters, instantly reducing 100K candidates to a high-recall pool of 500. Stage 2 applies a lightweight, CPU-optimized Cross-Encoder to re-rank the top 500, extracting deep semantic relevance against the job description that bi-encoders miss. Stage 3 computes the final ranking using a 7-feature weighted heuristic model. We evaluate career domain evidence (32%), search/retrieval expertise (26%), and vector DB infrastructure (10%), alongside behavioral signals like notice periods. Crucially, we apply aggressive multiplicative penalties to weed out low-quality matches: generalized services firms receive a 0.4x penalty, keyword stuffers get 0.2x, and impossible 'honeypot' profiles are zeroed out via a strict two-layer runtime check. Finally, Stage 4 generates dynamic, non-templated reasoning strings grounded purely in the candidate's actual skill durations, endorsements, and career trajectory, ensuring transparent and hallucination-free justifications for every rank.

